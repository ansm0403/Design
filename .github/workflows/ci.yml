name: CI

# 언제 실행할지 — main 에 push 될 때, 또는 main 을 대상으로 PR 을 올릴 때
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # 우분투 최신 VM 에서 실행

    steps:
      # 1) 저장소 코드를 VM 으로 내려받는다
      - name: Checkout
        uses: actions/checkout@v4

      # 2) pnpm 을 먼저 설치한다 (Node 설치보다 앞에 있어야 캐시가 동작함)
      #    version 생략 → 루트 package.json 의 "packageManager": "pnpm@10.33.4" 를 자동으로 읽음
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3) Node.js 20 설치 + pnpm 스토어 캐시 활성화
      #    캐시 키는 pnpm-lock.yaml 기준 → lockfile 이 바뀌면 캐시 무효화
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4) 의존성 설치 (--frozen-lockfile: lockfile 과 package.json 이 어긋나면 CI 실패)
      #    루트 pnpm.onlyBuiltDependencies(esbuild, @parcel/watcher) 도 여기서 빌드됨
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5) 전체 패키지 빌드 (-r = recursive, 의존성 그래프 위상 순서로 실행)
      #    tokens → ui 순서가 자동 보장됨 (ui 가 tokens 에 의존하므로)
      - name: Build packages
        run: pnpm -r build

      # 6) 테스트 — "vitest" 가 아니라 "vitest run" 으로 1회 실행
      #    package.json 의 "test": "vitest" 는 watch 모드라 CI 에서 멈출 수 있음
      #    ⚠️ 실행 시 stderr 에 canvas 경고가 뜨지만 테스트는 통과함 (phase-4.md 참조)
      - name: Run tests
        run: pnpm --filter @my-ds/ui exec vitest run

      # 7) Storybook 빌드 — MDX 문서가 컴파일 오류 없이 빌드되는지 CI 에서 검증
      #    빌드 결과물(storybook-static/)은 검사만 하고 배포하지 않음
      - name: Build Storybook
        run: pnpm --filter @my-ds/ui run build-storybook
